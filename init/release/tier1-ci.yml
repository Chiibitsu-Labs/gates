# Written by `gates init`: the toolkit SHAs in this file are already set to the release
# init ran from, so the header's step about replacing them is done. Do not redo it by
# hand, and move them later only by running init from a newer release.
# Tier 1 — the caller. Drop at .github/workflows/tier1.yml.
#
# BEFORE YOU COMMIT THIS FILE — six things, each explained in the block it points at:
#   1. Replace all THREE pinned TOOLKIT SHAs — two in this file, one in review-ci.yml; the
#      `actions/*` pins below are not among them — with the release you want, taken from the toolkit's
#      Releases table and never from another repo's copy of this file.  (see: "The gates
#      themselves live in Chiibitsu-Labs/gates", below)
#   2. Drop `templates/review-ci.yml` in as .github/workflows/review.yml, and do its three
#      setup steps. The draft reviewer is NOT in this file and must not be: a job's failure
#      sets its WORKFLOW's conclusion, and docs/04's auto-merge condition 1 is "Tier 1 is
#      green", which a session reads off the workflow. An exhausted quota would otherwise
#      report the deterministic gates as failed on a diff they passed. A model reviewer is
#      never a required check (docs/04).
#   3. Turn on GitHub's native secret scanning, and wire merge-time enforcement separately.
#      The toolkit scans the working tree only.  (see: the `gates:` job)
#   4. Swap the `project:` job's steps for your stack, or delete a step and say why in the
#      commit — never neuter one into always-green.  (see: the `project:` job)
#   5. Mark this workflow's JOBS required in branch protection — not the workflow, and not
#      the draft reviewer. Branch protection selects CHECK RUNS, and a check run is a job,
#      never a workflow: measured on vibeOS's own PR, whose Tier 1 workflow runs one
#      ordinary job, the only check reads `Deterministic gates` — that job's `name:` — and
#      nothing reads `Tier 1`. Do NOT copy that string: this file's `gates:` job is a
#      reusable-workflow CALL, a different shape, and how such a call composes its check
#      name is NOT measured here. So open a first PR, read the exact names off its checks
#      list, and mark those. Your host's preview check too. This workflow cannot assert any
#      of it.  (see: the last step)
#   6. Drop `templates/security-ci.yml` in as .github/workflows/security.yml and do its three
#      steps. It is the repo's own security check (vibeOS docs/04 "Who merges", condition 5);
#      without it every PR in the repo is a founder merge.
#
# A gate that cannot fail is not a gate, and a gate that cannot say "I don't know" will
# say "fine." The toolkit holds both: every gate proves it can fail before it runs against
# your tree — against a planted failure, or with its own `--selftest` where a fixture tree
# cannot hold the subject, which is the credential scanner's case. The shared library gives
# every gate a three-outcome vocabulary — clean, violation, and could not check, the last of
# them RED — and the encoding is not the exit code: a gate reports `UNKNOWN [gate] …` and
# exits 1, because exit 2 means a broken invocation.
#
# HAVING THE VOCABULARY IS NOT USING IT. Two of the six shell gates take the UNKNOWN path
# today; the other four have no indeterminate branch and report CLEAN on a subject they could
# not read — an empty manifest, a workflow spelling the grep does not recognise, a file that
# exists but is untracked where the tracked-ness check quietly does not run. Read a green from
# those four as "found nothing", never as "looked and there was nothing".
#
# THE TWO PYTHON GATES ARE NOT THERE YET, and this is where the toolkit stands against the
# rule rather than a promise it keeps: the credential scanner goes red on a whole-gate
# INDETERMINATE but green on a qualified pass, and the reference gate reports its unvalidated
# inputs and exits 0 — a two-figure "NOT validated" line on a green run is normal, not a
# failure. docs/04 Tier 1 owns the rule; do not read this caller as evidence it is met.
#
# KNOWN LIMIT, stated rather than papered over: the toolkit's gate loop runs every shell
# gate first and its two Python gates last, each alphabetically, so `check_references` runs
# seventh of eight — over your tree BEFORE `check_secrets` proves its own
# redaction has not drifted. That reference gate keeps a hand-maintained copy of the
# credential shapes so it can redact what it prints, and that copy has drifted twice — so
# on a third drift it can print a credential-shaped value into the log before the check
# built to catch that has run. `chiibitsu/vibeOS:.github/workflows/tier1.yml` orders the two deliberately and says
# why; this caller cannot, because the order lives in the toolkit. Filed against the
# toolkit alongside its history-range gap.
#
# EVERY third-party action here is pinned to a commit SHA, never a tag. A tag is mutable:
# whoever owns the action can repoint it, and it then runs with access to your source and
# whatever secrets the job holds. The toolkit gates this mechanically, but know the rule
# rather than meeting it only as a red check.
#
# The gates themselves live in Chiibitsu-Labs/gates and are called by SHA, never copied here —
# except the interim `session-links:` job below, which says why.
# A gate copied into a repo and edited there is the parallel-copies failure. To change a
# gate, change it in the toolkit and bump the pin. The SHA appears twice in this file —
# the `uses:` line plus `gates_ref`, because gates.yml cannot discover its own commit and
# the ref it runs from has to be handed to it — and once more in review-ci.yml, whose
# review.yml takes no such input. Bump all three together: a split pin runs one release's
# workflow over another release's gates.
# Take the SHA from the toolkit's Releases table, never from another repo's copy of this
# file — Chiibitsu-Labs/gates ships its own caller pinned to the PREVIOUS release.
#
# The project steps below are this repo's, not the toolkit's: they need the repo's own
# runtime and scripts. Deliberately NOT using `--if-present` anywhere — it turns a missing
# script into a silent pass, which is the two-state failure this header opens with.

name: Tier 1

on:
  pull_request:
  # Every branch. Narrowing push to the default branch leaves branch work with no gate
  # until a PR exists. docs/04 permits the narrow form ONLY where a push that would fail
  # CI is already refused before it leaves the machine — the property, not a checklist —
  # AND the narrowed form must still carry `tags: ['**']`. A tag gets no pull_request run,
  # so `branches:` alone leaves an annotated tag with no CI at all, and a tag annotation
  # lives in no tree and no diff.
  #
  # THE HOOK IS THE POINT, AND THIS TEMPLATE SHIPS NONE. vibeOS holds the property with a
  # pre-push hook whose selftest compares its gate list and order against its workflow —
  # that is what "already refused before it leaves the machine" means in practice. Nothing
  # in this template gives you one, so AS SHIPPED THIS FILE MUST NOT NARROW. Ship the hook
  # first, then narrow, in that order and not the other way round.
  push:

permissions:
  contents: read

concurrency:
  group: tier1-${{ github.ref }}
  # PULL REQUESTS only, and the reason has changed with this file. The toolkit scans the
  # WORKING TREE, so neither run here audits a commit range at all — the old rationale (a
  # cancelled push run orphaning the A..B patch that holds an added-then-deleted credential)
  # belonged to the vendored step this caller replaced. Push runs stay uncancellable anyway,
  # because nothing in this workflow audits pushed history and a run you cancel is one more
  # thing that did not look. (The `session-links:` job does read a push range, on the default
  # branch, and a run dropped while another waits in this group is a limit its comment states.)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Deterministic gates, from the toolkit: secret scan, reference check, action SHA
  # pinning, migrations, RLS, proxy location, required files, public env prefixes, and the
  # service-role reachability walk — with the checkout they need (fetch-depth: 0, lfs: true).
  #
  # THE SECRET SCAN HERE IS WORKING-TREE ONLY, and that costs THREE things, not one. The
  # toolkit's reusable workflow passes the scanner no history range, no pushed ref name and
  # no tag-object file — so a credential added in one commit and deleted in the next, a
  # BRANCH NAMED with one, and one written into an ANNOTATED TAG'S MESSAGE all reach the
  # remote unscanned by this job. The vendored scanner accepts all three inputs and the
  # workflow supplies none, so this is wiring rather than capability, and the same gap is
  # filed against the toolkit. Native secret scanning below closes the history leg only.
  #
  # CLOSING THAT IS A REQUIRED SETUP STEP, not advice — a repo wired from this template and
  # nothing else has no history coverage at all. Turn on **GitHub's native secret scanning**
  # with push protection: vendor-maintained patterns, continuous history coverage, and it
  # blocks the credential before it reaches the remote. Free on public repos; Advanced
  # Security on private.
  #
  # ON A PRIVATE REPO WITHOUT ADVANCED SECURITY, that option costs money, and a required
  # step with no free path is one nobody performs. The free one: run a gitleaks BINARY as a
  # step in the `project:` job below, pinned to a checksum you verified yourself — gitleaks
  # publishing release checksums is NOT VERIFIED HERE, so check before you plan around it,
  # and if there is none, pin by digest of the bytes you downloaded and reviewed.
  #
  # THAT STEP NEEDS TWO THINGS THIS FILE DOES NOT GIVE IT, and adding it without them buys
  # a green that looked at one commit:
  #   - `fetch-depth: 0` on the `project:` checkout below. It ships with `lfs: true` and
  #     nothing else, so the job has ONE commit in it and there is no history to walk.
  #   - a range to scan, which does not exist on `pull_request` at all: `github.event.before`
  #     and `.after` are `push`-only, this workflow carries both triggers, and `project:`
  #     has no `if:`. `chiibitsu/vibeOS:.github/workflows/tier1.yml` spends ~80 lines
  #     computing one, with guards for deletions, force-pushes, first pushes and tag pushes.
  #     Read that if you can — it is a PRIVATE repo, so you may not be able to, and the
  #     toolkit does not carry the computation either.
  #
  #     SO HERE IS THE ROUTE THAT NEEDS NOTHING YOU CANNOT REACH: scope the step to push
  #     events, where the range exists —  `if: github.event_name == 'push'` on the step,
  #     scanning `${{ github.event.before }}..${{ github.event.after }}` — and say in the job
  #     that PR-triggered runs are NOT history-scanned. That is an honest partial. It still
  #     owes you the four guards above: an all-zero `after` means a deletion, an all-zero
  #     `before` means a first push with no range to diff, a force-push can leave `before`
  #     unreachable (`git cat-file -e` it first), and a tag push is not a branch push. Handle
  #     each or the step errors and a failing step is not a scan. Do not write one expression
  #     and assume.
  #   - AND KNOW WHAT THE RANGE DOES NOT BUY YOU. Of the three gaps named at the `gates:` job
  #     above, a range closes ONE: the added-then-deleted credential. The branch-name leg and
  #     the annotated-tag-object leg are not range problems — in vibeOS they are separate
  #     inputs to its own scanner, and they do not transfer to gitleaks or to any other tool
  #     by copying a range. Closing those two is its own work; this file does not give it to
  #     you, and a gate that closes one leg of three should say so rather than read as done.
  #   - AND IT GOES FIRST IN THE JOB, before install, test and build. A repo that commits
  #     generated bundles can have `npm run build` overwrite a tracked file, so a value the
  #     build produced gets reported as a credential the PR committed; scanning before any
  #     project code also means it reads the tree as checked out rather than as some earlier
  #     step left it. Appending to the end of the job puts it after Build, which is the
  #     wrong side of exactly that.
  # A step is not a status check — the JOB is, and what branch protection lists is the job's
  # `name:` (`Project gates`) rather than its id. What blocks a merge is marking that check
  # required, the same wiring the preview check needs at the bottom of this file. And prove it can fail on the range it will actually scan: a credential planted
  # in a scratch commit passes a tip-only scan, which is the false green this header opens
  # against.
  #
  # PUSH PROTECTION IS NOT A STATUS CHECK, and cannot be marked required in branch
  # protection the way the preview check at the bottom of this file is. It acts at push
  # time, on its own track. So the two failure modes it leaves open are yours to close
  # deliberately: a bypass that someone approves lands the credential anyway and leaves an
  # alert behind, and nothing about that alert stops the merge. Wire merge-time enforcement
  # from GitHub's ruleset controls for secret scanning, and confirm the current control and
  # its plan requirement in GitHub's own docs — NOT VERIFIED HERE, and control names in this
  # area move. Whatever you wire, check it can fail before you count it.
  #
  # NO gitleaks-action step here, on purpose and on a REPORTED behaviour not verified in
  # this container: its v2 requires a paid licence
  # for org repos and EXITS BEFORE SCANNING without one — a step that reports success having
  # checked nothing, which is the one outcome docs/04 Tier 1 refuses. Swapping it for a
  # release-URL download trades SHA-pinned code for unverified bytes piped into execution.
  # If you wire a history scanner yourself, prove it can fail before you trust it.
  gates:
    uses: Chiibitsu-Labs/gates/.github/workflows/gates.yml@4d8a87ef4023cdcaf3ac79620f9718c5be09ffa4 # v1.2.2
    with:
      gates_ref: 4d8a87ef4023cdcaf3ac79620f9718c5be09ffa4 # v1.2.2

  # NO CLAUDE SESSION LINKS ON A PUBLIC REPO (vibeOS `templates/claude-md.md`, "Credit on
  # GitHub"; the founder, 2026-11-11). A link pushed to a public repo stays readable in its history.
  # The settings line (`"sessionUrl": false`) stops Claude Code adding them; this job catches
  # one that got through anyway: a session that never set it, or a link typed by hand.
  #
  # A RED HERE MEANS THE LINK IS ALREADY PUBLIC. The job runs after the push, and GitHub keeps
  # a pushed commit by its SHA and a PR description's edit history. Rewording before merge
  # keeps it off the default branch; it does not unpublish it, so the session says so in its
  # report. The settings line and the brief are the only layers that prevent; this one detects.
  #
  # WHAT IT READS, for the commits the change adds (on a PR: what the head holds that neither the
  # base nor the default branch does; on a push to the default branch: what the push added; on a
  # tag push: what no branch holds). A push to any OTHER branch is not scanned: its PR is the
  # merge gate, and scoping a branch push with no PR kept producing false reds and greens:
  # each commit's message and every line it adds to a file (a merge commit's own additions
  # included), and the path and whole content, at the tip, of every file those commits touch.
  # Reading added lines catches a link added in one commit and removed in the next, which a
  # merge commit or a rebase merge would otherwise land in history. Reading touched files whole
  # means a file that already held a link goes red until the link is edited out. Also the PR's
  # title and description, and an annotated tag's message. NUL bytes are stripped before
  # matching, so "binary" files and UTF-16 text are read too. It prints commit SHAs and file
  # paths, never the matched text, and never a path that itself holds a link.
  #
  # WHAT IT DOES NOT READ, stated rather than implied: commits already on the default branch or
  # the PR's base (what to do about links already in history is the founder's call), PR comments and
  # review threads, a PR description edited after the last push (an edit starts no run
  # of this workflow; templates/session-links-edited-ci.yml, below, covers it), LFS
  # content (only the pointer is checked out), a branch pushed
  # with no PR yet, an encoded or compressed copy of a link (JSON-escaped, percent-encoded,
  # zipped), and a direct push to the default branch whose run GitHub dropped because a
  # newer one queued behind it in the same concurrency group (a PR merge was checked on its PR).
  #
  # ON A PRIVATE REPO it passes and says so: session links are kept there by the same rule.
  # It reads visibility from the event at run time, so a repo made public later starts
  # checking on its next run, with no edit here. A visibility it cannot read is RED.
  #
  # INTERIM, AND A COPY: docs/04 says gates live in Chiibitsu-Labs/gates and a gate copied into
  # a repo is the parallel-copies failure. This one is copied with the template until it moves
  # into the toolkit with fixtures (open work on vibeOS's board). Until then, edit it only for a
  # reproduced false green or false red, in its own commit, and re-copy from vibeOS's template
  # (a repo's PM pastes the text into the brief; sessions there cannot read vibeOS) rather
  # than patching a repo's copy. It proves it can fail with its own in-step self-test.
  #
  # Its own job, not a step in `project:`: it needs the full history (`fetch-depth: 0`), which
  # `project:` does not check out, and `project:` is the block a repo rewrites for its stack,
  # where a step is easy to lose. Mark this job required in branch protection like the others
  # (header, item 5).
  #
  # THIS WORKFLOW NEVER RUNS ON AN EDITED PR, so a session link pasted into the description
  # after the last push goes unread here. templates/session-links-edited-ci.yml runs this same
  # job on `edited` under its own name: copy it beside this file, and when you change this
  # job, copy it there whole, keeping that job's name, in the same commit.
  #
  # The marker strings are SPLIT across quotes in the script below, on purpose: a public
  # repo that copies this file would otherwise flag its own workflow the first time a PR
  # touched it. Keep them split when you edit. Any file that has to NAME the markers (a
  # standing-orders line, say) describes them in words instead, or this job flags it.
  session-links:
    name: No session links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every branch and tag, so a push's range can be computed and other refs excluded.
          fetch-depth: 0

      - name: Commits, changed files and PR text hold no session link
        env:
          # Through env, never interpolated into the script: a PR title or body is text
          # anyone opening a PR writes, and `${{ }}` inside `run:` would execute it.
          REPO_PRIVATE: ${{ github.event.repository.private }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # -u only, NOT pipefail: every check below reads FILES, one stage at a time with each stage's
          # status checked, and the matcher runs in this shell, never on the right of a pipe, where its
          # UNKNOWN exit would end only a subshell and read as "no link".
          set -u
          PAT='Claude''-Session:|claude\.ai/code/''session'
          TMPD="${RUNNER_TEMP:-/tmp}/session-links"
          mkdir -p "$TMPD" || { echo "UNKNOWN [session-links] no temp dir"; exit 1; }
          # match_file FILE: 0 if it holds a link, 1 if not; anything else is UNKNOWN. NUL bytes are
          # stripped first, so a file grep would call binary is still read, and UTF-16 text (each ASCII
          # character followed by a NUL) reads as plain text.
          match_file() {
            tr -d '\000' < "$1" > "$TMPD/clean" || unknown "could not read text to check"
            local rc=0
            LC_ALL=C grep -a -i -E -- "$PAT" "$TMPD/clean" >/dev/null || rc=$?
            [ "$rc" -le 1 ] || unknown "the matcher failed"
            return "$rc"
          }
          # match_text TEXT: the same, for a string.
          match_text() {
            printf '%s\n' "$1" > "$TMPD/text" || unknown "could not stage text to check"
            match_file "$TMPD/text"
          }
          unknown() {
            echo "UNKNOWN [session-links] $1"
            echo "::error title=session-links could not check::$1"
            exit 1
          }
          # Workflow-command escaping, so a file named with a newline cannot inject a command.
          esc() { local s="${1//%/%25}"; s="${s//$'\r'/%0D}"; printf '%s' "${s//$'\n'/%0A}"; }
          FAIL=0
          flag() { echo "::error title=session link::$(esc "$1")"; FAIL=1; }

          # Prove the matcher can fail before a clean result means anything.
          match_text "$(printf 'Fix\n\nclaude''-session: x')" || unknown "self-test: a trailer was not caught"
          match_text 'see https://claude.ai/code/''session_x' || unknown "self-test: a session URL was not caught"
          printf 'x\000y https://claude.ai/code/''session_x\n' > "$TMPD/nul" || unknown "self-test: could not stage"
          match_file "$TMPD/nul" || unknown "self-test: a file with a NUL byte was skipped"
          match_text "$(printf 'Co-Authored-By: Claude <noreply@anthropic.com>\nhttps://claude.ai/code')" \
            && unknown "self-test: clean text was flagged"

          case "${REPO_PRIVATE:-}" in
            true)  echo "private repo: session links are allowed here; nothing to check"; exit 0 ;;
            false) ;;
            *)     unknown "repository visibility is not in the event" ;;
          esac

          ZERO=0000000000000000000000000000000000000000
          has_ref() { git rev-parse -q --verify "$1^{commit}" >/dev/null; }
          # REVS is the set of commits this event adds, as git rev-list arguments. Commits already
          # on the default branch, or on a PR's base, are excluded: history this job never asks anyone
          # to rewrite. Pushes to other branches are not scanned: their PR is the merge gate, and
          # scoping a branch push without a PR kept producing false reds and false greens.
          if [ "$EVENT" = "pull_request" ]; then
            [ -n "${PR_BASE:-}" ] && [ -n "${PR_HEAD:-}" ] || unknown "pull request without base or head"
            match_text "${PR_TITLE:-}
          ${PR_BODY:-}" \
              && flag "the PR title or description holds a session link"
            TIP="$PR_HEAD"
            REVS="$PR_HEAD"
            if has_ref "$PR_BASE"; then REVS="$REVS ^$PR_BASE"; fi
            if [ -n "${PR_BASE_REF:-}" ] && has_ref "origin/$PR_BASE_REF"; then REVS="$REVS ^origin/$PR_BASE_REF"; fi
            if has_ref "origin/$DEFAULT_BRANCH"; then REVS="$REVS ^origin/$DEFAULT_BRANCH"; fi
          elif [ "$EVENT" = "push" ]; then
            if [ "${PUSH_AFTER:-}" = "$ZERO" ]; then echo "ref deleted: nothing to check"; exit 0; fi
            if [ "${REF_TYPE:-}" = "tag" ]; then
              # An annotated tag's message is in no commit. Walk the chain (a tag can point at a
              # tag), bounded so a cycle cannot hang the job.
              OBJ="$REF"; HOPS=0
              while :; do
                TYPE="$(git cat-file -t "$OBJ" 2>/dev/null)" || unknown "could not read the pushed tag"
                [ "$TYPE" = "tag" ] || break
                BODY="$(git cat-file -p "$OBJ")" || unknown "could not read a tag object"
                match_text "$BODY" && flag "an annotated tag's message holds a session link"
                OBJ="$(printf '%s\n' "$BODY" | sed -n '1s/^object //p')" || unknown "could not read a tag's target"
                HOPS=$((HOPS + 1)); [ "$HOPS" -le 32 ] || unknown "tag chain longer than 32"
              done
              [ "$TYPE" = "commit" ] || { echo "tag points at a $TYPE: nothing more to check"; exit "$FAIL"; }
              # The commits under it that NO branch holds are checked here; the rest get their
              # branch's runs.
              TIP="$OBJ"
              BRANCHES="$(git for-each-ref --format='^%(objectname)' refs/remotes/origin)" \
                || unknown "could not list the published branches"
              EXCL="$(printf '%s' "$BRANCHES" | tr '\n' ' ')" || unknown "could not list the published branches"
              REVS="$TIP $EXCL"
            else
              TIP="$PUSH_AFTER"
              if [ "${REF#refs/heads/}" != "$DEFAULT_BRANCH" ]; then
                echo "push to a branch other than the default: its PR runs this check"; exit 0
              fi
              if [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "$ZERO" ] \
                   && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                REVS="$PUSH_AFTER ^$PUSH_BEFORE"
              elif [ "${PUSH_BEFORE:-}" = "$ZERO" ]; then
                REVS="$PUSH_AFTER"   # the default branch's first push: all of it is new
              else
                unknown "force-push to the default branch: its old tip is gone, so what it added cannot be told apart"
              fi
            fi
          else
            unknown "event '$EVENT' is not one this job knows how to scope"
          fi

          # Each commit, one at a time so the report can name it: its message, and every line it
          # ADDS to a file (a removed line never adds a red of its own; a touched file still holding a
          # link stays red until it is gone, below). The
          # added lines matter because a link added in one commit and removed in the next is gone at
          # the tip but stays in history once a merge commit or a rebase merge lands. `--cc` reads
          # what a merge itself added; `--text` reads a binary file's lines too.
          # shellcheck disable=SC2086  # REVS is a list of revisions, split on purpose
          COMMITS="$(git rev-list $REVS)" || unknown "could not list the commits to check"
          N=0
          PATCH="${RUNNER_TEMP:-/tmp}/session-links-patch"
          for C in $COMMITS; do
            N=$((N + 1))
            SHORTC="$(git rev-parse --short "$C")" || unknown "could not name a commit"
            MSG="$(git log -1 --format=%B "$C")" || unknown "could not read a commit message"
            match_text "$MSG" && flag "commit $SHORTC holds a session link in its message"
            git diff-tree -p --text --no-color --no-ext-diff --root --cc --format= "$C" > "$PATCH" \
              || unknown "could not read a commit's changes"
            # A plain commit marks an added line `+`; a merge's combined diff marks a line it added
            # against EVERY parent `++` (a line one parent already had came from that parent).
            ADD='^\+'; [ "$(git rev-list --parents -n1 "$C" | wc -w)" -gt 2 ] && ADD='^\+\+'
            # Hunk lines only, chosen by position, not text: a file's header lines come before its
            # first `@@`, and a hunk line always starts with a +, - or space, never with `diff `.
            # Each stage writes a file and is checked, so a stage that fails is UNKNOWN, not "clean".
            awk '/^diff /{h=0; next} /^@@/{h=1; next} h' "$PATCH" > "$PATCH.hunks" \
              || unknown "could not read a commit's changed lines"
            GRC=0; grep -a -E "$ADD" "$PATCH.hunks" > "$PATCH.added" || GRC=$?
            [ "$GRC" -le 1 ] || unknown "could not pick a commit's added lines"
            match_file "$PATCH.added" && flag "commit $SHORTC adds a session link to a file"
          done
          echo "checked $N commit(s): messages and added lines"

          # Files: every path those same commits add or change, read as it stands at the tip
          # commit (not the working tree, which on a PR is a merge result). A path deleted by the
          # tip has nothing left to read. Paths are checked as well as contents. `--cc` lists what a
          # MERGE commit itself changed (a file added while resolving one), which plain `git log`
          # leaves out, and still skips what a merge only brought in from a parent. The list is
          # NUL-separated end to end, so a file name holding a newline stays one name.
          LIST="${RUNNER_TEMP:-/tmp}/session-links-files"
          if [ -n "$COMMITS" ]; then
            # shellcheck disable=SC2086
            git log -z --cc --format= --name-only --no-renames $REVS > "$LIST.raw" \
              || unknown "could not list the changed files"
            sort -zu < "$LIST.raw" > "$LIST.sorted" || unknown "could not sort the file list"
            sed -z '/^$/d' "$LIST.sorted" > "$LIST" || unknown "could not clean the file list"
          else
            : > "$LIST"
          fi
          M=0
          BLOB="${RUNNER_TEMP:-/tmp}/session-links-blob"
          while IFS= read -r -d '' F; do
            # A path that holds a link is never printed: that would copy the link into the log.
            NAME="$F"
            match_text "$F" && { flag "a changed file's path holds a session link"; NAME="that file"; }
            # ls-tree prints nothing for a path the tip no longer has, and fails only on a real error.
            ENTRY="$(git --literal-pathspecs ls-tree "$TIP" -- "$F")" || unknown "could not look up a changed file"
            case "$ENTRY" in *" blob "*) ;; *) continue ;; esac   # deleted, or a submodule
            M=$((M + 1))
            git cat-file blob "$TIP:$F" > "$BLOB" || unknown "could not read a changed file"
            match_file "$BLOB" && flag "$NAME holds a session link"
          done < "$LIST"
          echo "checked $M changed file(s)"

          if [ "$FAIL" -ne 0 ]; then
            echo "A public repo carries no session link (vibeOS templates/claude-md.md, 'Credit on GitHub')."
            echo "A link already pushed here is public: GitHub keeps the commit by its SHA, and a PR"
            echo "description keeps its edit history. Say so in your report. Before merge, on your own"
            echo "branch: reword or drop the commit that carries it, and edit it out of the file or the PR"
            echo "text, so it never reaches the default branch. A link that was in a file before this"
            echo "change has no commit of yours to reword: edit it out of the file. A re-run reads the old"
            echo "PR description, so push a commit after editing it. Then set \"sessionUrl\": false in the"
            echo "attribution block of .claude/settings.json."
          fi
          exit "$FAIL"

  # This repo's own Tier 1 steps. Node/TypeScript assumed; swap the runtime steps for
  # another stack and keep the shape. If a step does not apply, delete it and say why in
  # the commit — do not neuter it into always-green.
  project:
    name: Project gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # lfs: true — without it an LFS-tracked file arrives as a small pointer stub, and
          # a build or test reading it gets the stub. The toolkit's own checkout sets this
          # too; this job has its own and does not inherit that one.
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci`, not `npm install` — installs exactly the lockfile and fails when the
      # lockfile and package.json disagree. That disagreement is a real signal.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # docs/04's Tier 1 list is "typecheck, lint, format" — format is its own gate, not
      # something to assume lint covers. Plenty of eslint configs enforce no formatting
      # at all, so leaving this out lets malformed files through a gate that advertises
      # itself as the complete list.
      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Fails on HIGH and above. Tune the threshold deliberately; do not delete the step
      # because it is noisy — noisy here means genuinely vulnerable deps.
      - name: Dependency audit
        run: npm audit --audit-level=high

      # docs/04 Tier 1 also requires "preview deploy succeeds". That cannot live here:
      # the deploy is performed by the hosting provider, which reports its own commit
      # status. This workflow going green is therefore NOT the whole of Tier 1 — mark the
      # provider's preview check as a required status check in branch protection too.
      # Without it, broken routing or a missing runtime env var passes a gate advertised
      # as complete. The same is true of red blocking at all: the workflow only makes the
      # gate run; branch protection is what makes red stop a merge, and what it lists is
      # each JOB's check run, never the workflow name. Set both.
      - name: Preview deploy is a separate required check
        run: |
          echo "Tier 1 also requires a green preview deploy."
          echo "Mark your host's preview check as REQUIRED in branch protection —"
          echo "this workflow cannot assert it."
