# Copy this to .github/workflows/gates.yml in your repo. The SHA below appears twice on
# purpose: a reusable workflow cannot discover its own commit, so the ref you pin has to be
# handed to it. Change both together.
#
# READ THIS BEFORE COPYING: the SHA shipped below is v1.3.2, set by hand after that release
# was tagged (2026-11-27), and the Releases table in the README is what says whether it is
# still the one to use. This file once shipped v1.2.0, which the table marks **do not use**,
# through three tags (v1.2.1, v1.2.2 and v1.3.0); a pin in a file nobody re-reads goes stale silently, so check the
# table every time.
#
# v1.3.0 ADDS THE STANDING-ORDERS CHECK, so a repo that copies this file is red until
# `gates init` has run in it from that release. In a repo that will carry the standing
# orders, do not copy this file at all: run `init`, which writes the callers itself (README,
# "Standing orders"). This file is for a repo that wires a caller by hand.
#
# It does NOT name the release you are reading, and cannot: a commit cannot contain its own
# SHA. What it does name is not derivable, and has been each of these: an untagged ancestor
# (v1.0.0, v1.0.1, the second labelled with its own version number), the previous release,
# and a release two and three behind (v1.2.2 and v1.3.0 both shipped v1.2.0's). Since v1.3.0
# the pin is moved by hand after each tag (README, "Cutting a release", step 5), so between
# releases it names the latest one and inside a tagged release it names the one before. So
# take the SHA you want from the Releases table in the README, never from this line.
on: [pull_request, push]
jobs:
  gates:
    uses: Chiibitsu-Labs/gates/.github/workflows/gates.yml@8fae32cebcbab17bbca87e3f09438a3c46d91cce # v1.3.2
    with:
      gates_ref: 8fae32cebcbab17bbca87e3f09438a3c46d91cce # v1.3.2

  # ── The draft-stage reviewer (Tier 2, not a gate) ────────────────────────────────────────
  #
  # ACTIVE from v1.2.1 onward. It shipped commented in v1.2.0 for a reason that has since
  # stopped being true: review.yml did not exist at the release this template pinned then, so
  # an active line would have failed file-not-found on every run. review.yml exists at the
  # release the pin below names, so the block is live. A comment kept past the expiry of its
  # own reason is how a file starts lying quietly.
  #
  # It needs a repository secret CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token`. Without
  # it the job fails loudly rather than reviewing nothing.
  #
  # It runs ONLY while the pull request is a draft. On a ready PR the job reports `skipped`,
  # which is an absence, not a pass — account for it before flipping, as AGENTS.md says.
  #
  # From v1.2.1 it also skips on pull requests FROM FORKS, and the pin below is later than
  # that. A fork PR gets no repository secrets, so the token expression is empty against a
  # `required: true` declaration and the job would be red for a reason having nothing to do
  # with the code. A pin older than v1.2.1 on this line loses the skip.
  #
  # ONE SHA in this block, on the `uses:` line. The line under `secrets:` is a token mapping.
  review:
    # PERMISSIONS ARE THE CALLER'S TO GRANT. A called workflow can only narrow the token it is
    # handed, never widen it, so review.yml's own `permissions:` block is a ceiling and not a
    # grant. On a repository whose default workflow token is read-only, the tally step's
    # `gh pr comment` gets a 403 and the job is red on every draft PR — a reviewer that fails
    # for a reason having nothing to do with the code.
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    uses: Chiibitsu-Labs/gates/.github/workflows/review.yml@8fae32cebcbab17bbca87e3f09438a3c46d91cce # v1.3.2
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
