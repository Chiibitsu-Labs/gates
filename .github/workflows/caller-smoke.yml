name: caller-smoke
# Uses this repo AS a consumer, so the reusable workflow is exercised rather than
# assumed. An untested reusable workflow is a gate nobody has seen work — the same
# defect the toolkit exists to refuse, one level up. It caught a real one on its first
# run: github.job_workflow_sha resolved to nothing, and the job stopped instead of
# silently checking out HEAD.
#
# Pinned at v1.3.1, deliberately a fixed commit and not the branch head, because that is
# what a consumer does. From this release the standing-orders check does not run over this
# repo: it is exempt (the founder's ruling, 2026-11-24), and the run's log says so with an
# `EXEMPT [standing-orders]` line. The README's release checklist says how this pin moves.
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  gates:
    uses: Chiibitsu-Labs/gates/.github/workflows/gates.yml@de75c411012e1266ca3ade2cbc6d5e9132a7e844 # v1.3.1
    with:
      gates_ref: de75c411012e1266ca3ade2cbc6d5e9132a7e844 # v1.3.1
